<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a6a86">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<title>Coolfy App · desarrollo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="banda" id="banda" role="status">Cargando…</div>
<header class="top">
  <div class="fila">
    <div><h1><img src="icons/logo-coolfy.png" alt="Coolfy" style="height:26px;vertical-align:middle;margin-right:8px">App · Barcelona</h1><div class="sub" id="fecha"></div></div>
    <button type="button" class="btn" id="btn-leer">Volver a leer</button>
  </div>
  <div class="sub" id="estado">—</div>
  <label class="campo"><span>Gestor</span><select id="sel-gestor"><option value="">Todos</option></select></label>
</header>
<main id="main" tabindex="-1"></main>
<nav class="tabs" aria-label="Secciones">
  <button type="button" data-tab="agenda" aria-current="page">Agenda</button>
  <button type="button" data-tab="alertas">Alertas</button>
  <button type="button" data-tab="datos">Comprobación</button>
</nav>
<section class="hoja" id="hoja" aria-label="Ficha de la obra" aria-hidden="true">
  <header><button type="button" class="btn" id="btn-cerrar">Volver</button><h2 id="hoja-t">Ficha</h2></header>
  <div class="cuerpo" id="hoja-c"></div>
</section>
<script src="js/data/contract.js"></script>
<script src="js/data/demo.js"></script>
<script src="js/data/servidor.js"></script>
<script src="js/app.js"></script>
</body>
</html>
